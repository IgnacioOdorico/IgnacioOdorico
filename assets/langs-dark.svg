    <text class="num" x="432" y="140" text-anchor="end" fill="#8b949e">2,0 %</text>
  </g>
  <g class="row" style="animation-delay:1.20s">
    <circle cx="29" cy="160" r="5" fill="#6e7681"/>
    <text class="label" x="42" y="164" fill="#c9d1d9">Otros</text>
    <text class="num" x="216" y="164" text-anchor="end" fill="#8b949e">1,5 %</text>
