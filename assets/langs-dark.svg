<svg xmlns="http://www.w3.org/2000/svg" width="480" height="232" viewBox="0 0 480 232" role="img" aria-label="Lenguajes más usados">
  <title>Lenguajes más usados</title>
  <style>
    .label { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .foot { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .num { font: 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .seg { transform-box: fill-box; transform-origin: left center; animation: grow 0.8s ease-out both; }
    .row { animation: fade 0.5s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .seg, .row { animation: none; } }
  </style>
  <defs>
    <clipPath id="bar"><rect x="24" y="54" width="432" height="10" rx="5"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="231" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="24" y="19" width="3" height="14" rx="1.5" fill="#3e9ded"/>
  <text class="title" x="36" y="32" fill="#e6edf3">Lenguajes más usados</text>
  <rect x="24" y="54" width="432" height="10" rx="5" fill="#30363d"/>
  <g clip-path="url(#bar)">
    <rect class="seg" style="animation-delay:0.00s" x="24.00" y="54" width="198.82" height="10" fill="#3572A5"/>
    <rect class="seg" style="animation-delay:0.15s" x="222.82" y="54" width="130.46" height="10" fill="#3178c6"/>
    <rect class="seg" style="animation-delay:0.30s" x="353.28" y="54" width="54.68" height="10" fill="#b07219"/>
    <rect class="seg" style="animation-delay:0.45s" x="407.96" y="54" width="23.12" height="10" fill="#e34c26"/>
    <rect class="seg" style="animation-delay:0.60s" x="431.08" y="54" width="9.68" height="10" fill="#8b949e"/>
    <rect class="seg" style="animation-delay:0.75s" x="440.76" y="54" width="8.84" height="10" fill="#663399"/>
    <rect class="seg" style="animation-delay:0.90s" x="449.60" y="54" width="6.40" height="10" fill="#6e7681"/>
  </g>
  <g class="row" style="animation-delay:0.30s">
    <circle cx="29" cy="88" r="5" fill="#3572A5"/>
    <text class="label" x="42" y="92" fill="#c9d1d9">Python</text>
    <text class="num" x="216" y="92" text-anchor="end" fill="#8b949e">46,0 %</text>
  </g>
  <g class="row" style="animation-delay:0.45s">
