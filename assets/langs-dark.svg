    <text class="num" x="216" y="116" text-anchor="end" fill="#8b949e">12,7 %</text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <circle cx="245" cy="112" r="5" fill="#e34c26"/>
    <text class="label" x="258" y="116" fill="#c9d1d9">HTML</text>
    <text class="num" x="432" y="116" text-anchor="end" fill="#8b949e">5,4 %</text>
